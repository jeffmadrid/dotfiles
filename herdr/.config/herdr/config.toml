onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[keys]
prefix = "ctrl+a"
switch_tab = ["prefix+1..9", "alt+1..9"]
next_tab = ["prefix+n", "ctrl+tab"]
previous_tab = ["prefix+p", "ctrl+shift+tab"]
split_vertical = ["prefix+v", "prefix+|"]
split_horizontal = ["prefix+minus"]

[ui]
sidebar_collapsed_mode = "hidden"
pane_borders = "off"
pane_outer_borders = false
status_indicators = "symbols"
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "herdr"

# Move the focused pane into its own new tab.
[[keys.command]]
key = "prefix+!"
type = "shell"
command = "herdr pane move $HERDR_ACTIVE_PANE_ID --new-tab --focus"
description = "move pane to new tab"

# Toggle the reviewr diff pane.
[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr pane"
